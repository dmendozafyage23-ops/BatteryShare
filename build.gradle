buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.2.2'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

tasks.withType(JavaCompile).configureEach {
    options.incremental = true
    options.compilerArgs += ['-Xlint:deprecation']
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
